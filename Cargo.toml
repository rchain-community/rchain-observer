[package]
name = "rchain-observer"
version = "0.3.0"
edition = "2021"
description = "Rho Observer: read-only multi-node finality evidence for Rholo networks"
license = "Apache-2.0"
repository = "https://github.com/rhovision-org/rho-observer"

[dependencies]
blake2 = "0.10"
hex = "0.4"
k256 = { version = "0.14", features = ["ecdsa"] }
prost = "0.13"
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }

